name: test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: songbirdapi
          POSTGRES_USER: songbirdapi
          POSTGRES_PASSWORD: songbirdapi
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run migrations
        env:
          ENV: test
          SONGBIRD_PG_HOST: localhost
          SONGBIRD_PG_PORT: 5432
          SONGBIRD_PG_USER: songbirdapi
          SONGBIRD_PG_PASSWORD: songbirdapi
          SONGBIRD_PG_DATABASE: songbirdapi
          SONGBIRD_API_KEY: test-key
          SONGBIRD_JWT_SECRET: test-secret
        run: make migrate

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Integration tests
        env:
          ENV: test
          CI: true
          SONGBIRD_PG_HOST: localhost
          SONGBIRD_PG_PORT: 5432
          SONGBIRD_PG_USER: songbirdapi
          SONGBIRD_PG_PASSWORD: songbirdapi
          SONGBIRD_PG_DATABASE: songbirdapi
          SONGBIRD_API_KEY: test-key
          SONGBIRD_JWT_SECRET: test-secret
        run: make test-integration
