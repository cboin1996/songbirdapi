name: docker
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Get Commit or Tag
        id: vars
        run: |
          tag="${GITHUB_SHA:0:8}"
          if [[ ${GITHUB_REF} == refs/tags* ]]; then
            ref="${GITHUB_REF}"
            tag=$(echo $GITHUB_REF | sed 's/refs\/tags\///g')
          fi
          echo "TAG=$tag" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        if: success()  && github.event_name == 'pull_request' # trigger only a build on PR's.
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: false
          tags: cboin/songbirdapi:latest,cboin/songbirdapi:${{steps.vars.outputs.TAG}}
          cache-from: type=registry,ref=cboin/songbirdapi:buildcache
          cache-to: type=registry,ref=cboin/songbirdapi:buildcache,mode=max
      - name: Build and Push
        if: success() && (github.event_name == 'push' || startsWith(github.ref, 'refs/tags/'))  # only trigger a build and push to docker registry on tag or commit sha off
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: cboin/songbirdapi:latest,cboin/songbirdapi:${{steps.vars.outputs.TAG}}
          cache-from: type=registry,ref=cboin/songbirdapi:buildcache
          cache-to: type=registry,ref=cboin/songbirdapi:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KEEBOX_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 223 ${{ secrets.KEEBOX_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.KEEBOX_HOST }}
            HostName ${{ secrets.KEEBOX_HOST }}
            User ${{ secrets.KEEBOX_USER }}
            Port 223
            IdentityFile ~/.ssh/deploy_key
            AddressFamily inet
            StrictHostKeyChecking no
          EOF

      - name: Deploy to keebox
        run: |
          ssh ${{ secrets.KEEBOX_HOST }} 'bash -s' << 'ENDSSH'
            set -e
            docker system prune -f
            cd ~/songbird
            # Pull explicitly + force-recreate. docker-compose up -d alone
            # can skip recreating if it thinks the image hasn't changed
            # (manifest-vs-cache races against a fresh push), which leaves
            # the old container running. force-recreate guarantees we get
            # the new image.
            docker-compose pull songbirdapi
            docker-compose run --rm --entrypoint alembic songbirdapi upgrade head
            docker-compose up -d --force-recreate songbirdapi
            healthy=
            for i in $(seq 1 30); do
              if docker-compose exec -T songbirdapi curl -sf http://localhost:8000/v1/health; then
                healthy=1
                echo "healthy"
                break
              fi
              sleep 3
            done
            [ "$healthy" = "1" ] || (echo "deploy health-check FAILED" && docker-compose logs --tail=50 songbirdapi && exit 1)
          ENDSSH
