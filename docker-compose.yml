services:
  songbirdapi:
    image: cboin/songbirdapi:latest
    restart: unless-stopped
    ports:
      - "9669:8000"
    volumes:
      - ./data:/songbirdapi/data
    environment:
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Optional; the defaults below match the app's own.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - SESSION_IDLE_DAYS=${SESSION_IDLE_DAYS:-30}
      - SESSION_ABSOLUTE_DAYS=${SESSION_ABSOLUTE_DAYS:-90}
      - SESSION_MAX_PER_USER=${SESSION_MAX_PER_USER:-10}
      - REFRESH_REPLAY_WINDOW_SECONDS=${REFRESH_REPLAY_WINDOW_SECONDS:-60}
      - REFRESH_REUSE_DETECTION=${REFRESH_REUSE_DETECTION:-true}
